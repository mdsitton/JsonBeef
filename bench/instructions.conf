# bench/instructions.sh's description of JsonTester (FormatCore's bench-kit; sourced by bash).
# Usage: bash bench/instructions.sh [input names...]      (beefbuild -config=Release first)
#   MODES="events document" limits the columns (default: events document stream write; also typed and
#   query, [JsonObject] binding and on-demand reading, from bench/compare's Beef harness, built with
#   bench/compare/build.sh beef, for twitter, citm_catalog and canada).
TESTER=./build/Release_Linux64/JsonTester/JsonTester
INPUT_DIR=bench/compare/inputs
EXTENSIONS=(json ndjson)
INPUTS=(twitter twitterescaped citm_catalog canada github_events gsoc-2018 mesh numbers marine_ik
	tiny rest records strings integers floats events)
MODES=(events document stream write)
BUILD_HINT="beefbuild -config=Release (inputs: bench/compare/gen-inputs.py)"

# typed and query run bench/compare's Beef harness; the others the tester's -bench-loop
instructions_command() { # mode path iterations options...
	local mode=$1 path=$2 iterations=$3
	shift 3
	if [ "$mode" = typed ] || [ "$mode" = query ]; then
		./bench/compare/bin/beef-jsonbench "jsonbeef-$mode" "$path" "loop=$iterations"
		return
	fi
	"$TESTER" -bench-loop "$mode" "$path" "$iterations" "$@"
}

# No write pass for batches; typed and query only for the inputs of their tracks
instructions_skip() { # mode path
	if [ "$1" = write ] && [[ "$2" == *.ndjson ]]; then
		return 0
	fi
	if { [ "$1" = typed ] || [ "$1" = query ]; } && [[ ! "$(basename "$2")" =~ ^(twitter|citm_catalog|canada)\. ]]; then
		return 0
	fi
	return 1
}

[package]
name = "jsonbench"
version = "0.1.0"
edition = "2021"

# Exact versions (the newest on 2026-10-01), locked with their dependencies in Cargo.lock. Library
# defaults throughout (no extra features).
[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sonic-rs = "=0.5.10"
simd-json = "=0.18.1"
jiter = "=0.17.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = 0

# Not used by build.sh: serde_json's default float parsing is not correctly rounded (canada and
# floats fail their checksums); `cargo build --features serde-float-roundtrip` checks the fix.
[features]
serde-float-roundtrip = ["serde_json/float_roundtrip"]

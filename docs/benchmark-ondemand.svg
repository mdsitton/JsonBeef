<rect class="bg" x="0" y="0" width="920" height="868" rx="10"/>
<text x="40.0" y="44.0" class="title" text-anchor="start">On-demand: a few fields from a large document: speed relative to JsonBeef JsonReader</text>
<text x="40.0" y="66.0" class="subtitle" text-anchor="start">one operation: extract the queried fields, skipping the rest · geometric mean over the inputs both handled of MB/s ÷ JsonBeef JsonReader's · higher is better</text>
